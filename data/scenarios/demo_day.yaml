# Demo evening in Tunis: 8 merchants, 5 charities, 3 drivers, 8 offers, 1 driver cancellation
# (Youssef, at 19:25, before his pickup at Mehrez Fruits et Légumes). If the plans change, check with
# `python -m foodrescue run --protocol replan` that the cancellation still moves at least one donation.
# Merchants and charities are real places in Tunis: names and map positions from Google Maps (November 2026).
# Everything they do in this scenario (offers, needs, capacities, opening hours) is invented for the demo.
# Drivers are fictional. Times are "HH:MM"; values above 23:59 mean the next day ("47:59" = end of tomorrow).
# Each offer has the merchant's raw text AND its structured version: the structured one is used
# while LLM intake is switched off (features.llm_intake in config/default.yaml).

name: demo-evening
seed: 42
city: Tunis
start: "18:00"
end: "23:30"

