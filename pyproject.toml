[project]
name = "foodrescue"
version = "0.1.0"
description = "Multi-agent system that matches surplus food from merchants with charities (academic project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools>=9.12",
    "ollama>=0.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "streamlit>=1.40",
    "folium>=0.17",
    "streamlit-folium>=0.22",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodrescue"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
